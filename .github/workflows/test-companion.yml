name: Test every companion file (SQL Server, SQLite, Python, Excel)

on:
  push:
  workflow_dispatch:

jobs:
  sql-server:
    name: SQL Server ${{ matrix.image }} scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ["2025-latest", "2022-latest", "2019-latest", "2017-latest"]
    steps:
      - uses: actions/checkout@v5
      - name: Run all SQL Server scripts and check the book's numbers (SQL Server ${{ matrix.image }} in Docker)
        run: bash tests/run_all.sh
        env:
          FULL_LOGS: "1"
          IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.image }}
      - name: Publish the report
        if: always()
        run: cat tests/output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sql-server-output-${{ matrix.image }}
          path: tests/output

  python-sqlite:
    name: Python and SQLite on ${{ matrix.os }}, Python ${{ matrix.python }}, pandas ${{ matrix.pandas }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.13", "3.15"]
        pandas: ["latest"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            pandas: "2.2.*"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the packages in requirements.txt
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ matrix.pandas }}" != "latest" ]; then python -m pip install "pandas==${{ matrix.pandas }}"; fi
      - name: Run every Python script and every SQLite script
        run: python tests/run_python.py
      - name: Publish the report
        if: always()
        shell: bash
        run: cat tests/output/PYTHON_REPORT_*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-output-${{ strategy.job-index }}
          path: tests/output

  excel:
    name: Excel workbooks (recalculated in LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install LibreOffice and openpyxl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          python -m pip install "openpyxl>=3.1"
      - name: Recalculate every workbook and compare with the book
        run: python tests/check_excel.py
      - name: Check every Excel number printed in the book (saved and recalculated values)
        if: always()
        run: python tests/check_book_numbers.py
      - name: Change inputs and check the results move as the book says (WAL, CDR grid, stress, Test 3)
        if: always()
        run: python tests/check_excel_scenarios.py
      - name: Check the lists, colour rules, chart and links saved in the files
        if: always()
        run: python tests/check_excel_features.py
      - name: Publish the reports
        if: always()
        run: cat tests/output/EXCEL_REPORT.md tests/output/BOOK_NUMBERS_REPORT.md tests/output/EXCEL_SCENARIOS_REPORT.md tests/output/EXCEL_FEATURES_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

  excel-second-checks:
    name: Excel workbooks (Open XML SDK and a second calculation engine)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Check every workbook against Microsoft's Open XML schema
        run: dotnet run --project tests/openxml -- excel
      - uses: actions/setup-python@v6
        if: always()
        with:
          python-version: "3.12"
      - name: Install the second calculation engine
        if: always()
        run: python -m pip install "formulas>=1.2" "openpyxl>=3.1"
      - name: Recalculate every formula with the second engine and compare with the book
        if: always()
        run: python tests/check_excel_formulas.py
      - name: Publish the reports
        if: always()
        run: cat tests/output/OPENXML_REPORT.md tests/output/EXCEL_ENGINE2_REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
